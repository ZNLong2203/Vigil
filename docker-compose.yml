# Vigil — local development stack.
#
# Everything here is an EMULATOR. No Google Cloud account, no billing, no network
# calls except to the Gemini API (which is optional — the skeleton runs without it).
#
#   make up      start this stack
#   make seed    create Pub/Sub topics + GCS bucket inside the emulators
#   make dev     run the API and the worker against it
#
# Emulator limitations (documented honestly, see README §Local development):
#   - Firestore emulator does NOT support vector search. Local runs fall back to
#     an in-memory cosine index; Cloud runs use Firestore vector search.
#   - Model Armor and Memory Bank have no emulator. Local runs use the in-repo
#     fallbacks in platform/guardrails and platform/memory.

name: vigil

services:
  firestore:
    image: google/cloud-sdk:emulators
    container_name: vigil-firestore
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
      --database-mode=firestore-native
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  pubsub:
    image: google/cloud-sdk:emulators
    container_name: vigil-pubsub
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=vigil-local
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/v1/projects/vigil-local/topics >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Stands in for Cloud Storage (raw uploads: photos, scanned PDFs, voice notes).
  gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: vigil-gcs
    command: -scheme http -port 4443 -public-host localhost:4443 -backend memory
    ports:
      - "4443:4443"

  # Stands in for Cloud Trace. This is where the reasoning-chain spans land locally,
  # so the "glass box" trace view works with no cloud project attached.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: vigil-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI            -> http://localhost:16686
      - "4318:4318"     # OTLP/HTTP     <- vigil.telemetry exports here
      - "4317:4317"     # OTLP/gRPC
