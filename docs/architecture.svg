<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470"
     role="img" aria-label="An untrusted artifact becomes a gated action through five stages, and can be stopped at four of them: blocked at the trust boundary, halted by the run budget, denied by agent identity, or held for a human by the action gate. The watchdog verifies worker output and can escalate.">

  <!-- The SVG carries its own ground: GitHub renders README images in isolation,
       so currentColor cannot inherit the light or dark page theme. -->
  <rect width="1280" height="470" fill="#0d1219"/>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5ee6a8"/>
    </marker>
    <marker id="a-stop" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="a-check" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b48bff"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- ── Verification lane ─────────────────────────────────────────────── -->
    <rect x="650" y="30" width="180" height="56" rx="8" fill="#161d27" stroke="#b48bff" stroke-width="1.5"/>
    <text x="740" y="53" text-anchor="middle" fill="#e7ecf3" font-size="13" font-weight="600">watchdog</text>
    <text x="740" y="71" text-anchor="middle" fill="#93a1b3" font-size="11">read-only · cannot act</text>

    <rect x="940" y="30" width="250" height="56" rx="8" fill="#161d27" stroke="#f0b24b" stroke-width="1.5"/>
    <text x="1065" y="53" text-anchor="middle" fill="#f0b24b" font-size="13" font-weight="600">escalated to a human</text>
    <text x="1065" y="71" text-anchor="middle" fill="#93a1b3" font-size="11">with the reasoning attached</text>

    <path d="M830 58 L934 58" stroke="#b48bff" stroke-width="1.5" marker-end="url(#a-check)"/>
    <text x="882" y="49" text-anchor="middle" fill="#93a1b3" font-size="10">unsupported claim</text>

    <!-- worker output goes up for verification, verdict comes back down -->
    <path d="M760 150 L722 92" stroke="#b48bff" stroke-width="1.5" marker-end="url(#a-check)"/>
    <text x="700" y="122" text-anchor="end" fill="#93a1b3" font-size="10">output</text>
    <path d="M800 92 L960 146" stroke="#b48bff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-check)"/>
    <text x="905" y="112" text-anchor="middle" fill="#93a1b3" font-size="10">verdict</text>

    <!-- ── Main flow ─────────────────────────────────────────────────────── -->
    <rect x="40" y="150" width="180" height="68" rx="8" fill="#161d27" stroke="#2e3a49" stroke-width="1.5"/>
    <text x="130" y="178" text-anchor="middle" fill="#e7ecf3" font-size="13" font-weight="600">artifact</text>
    <text x="130" y="196" text-anchor="middle" fill="#93a1b3" font-size="11">photo · voice · scan</text>
    <text x="130" y="211" text-anchor="middle" fill="#ff6b6b" font-size="10">untrusted</text>

    <rect x="262" y="150" width="180" height="68" rx="8" fill="#161d27" stroke="#5ee6a8" stroke-width="1.5"/>
    <text x="352" y="176" text-anchor="middle" fill="#e7ecf3" font-size="13" font-weight="600">trust boundary</text>
    <text x="352" y="194" text-anchor="middle" fill="#93a1b3" font-size="11">Gemma redacts,</text>
    <text x="352" y="209" text-anchor="middle" fill="#93a1b3" font-size="11">then screens</text>

    <rect x="484" y="150" width="180" height="68" rx="8" fill="#161d27" stroke="#2e3a49" stroke-width="1.5"/>
    <text x="574" y="176" text-anchor="middle" fill="#e7ecf3" font-size="13" font-weight="600">orchestrator</text>
    <text x="574" y="194" text-anchor="middle" fill="#93a1b3" font-size="11">plans · budgets</text>
    <text x="574" y="209" text-anchor="middle" fill="#93a1b3" font-size="11">checkpoints each hop</text>

    <rect x="706" y="150" width="180" height="68" rx="8" fill="#161d27" stroke="#2e3a49" stroke-width="1.5"/>
    <text x="796" y="176" text-anchor="middle" fill="#e7ecf3" font-size="13" font-weight="600">worker</text>
    <text x="796" y="194" text-anchor="middle" fill="#93a1b3" font-size="11">only the tools its</text>
    <text x="796" y="209" text-anchor="middle" fill="#93a1b3" font-size="11">registry entry holds</text>

    <rect x="928" y="150" width="180" height="68" rx="8" fill="#161d27" stroke="#f0b24b" stroke-width="1.5"/>
    <text x="1018" y="176" text-anchor="middle" fill="#e7ecf3" font-size="13" font-weight="600">action gate</text>
    <text x="1018" y="194" text-anchor="middle" fill="#93a1b3" font-size="11">policy → claim key</text>
    <text x="1018" y="209" text-anchor="middle" fill="#93a1b3" font-size="11">→ execute</text>

    <!-- flow arrows -->
    <path d="M220 184 L256 184" stroke="#5ee6a8" stroke-width="1.5" marker-end="url(#a-flow)"/>
    <path d="M442 184 L478 184" stroke="#5ee6a8" stroke-width="1.5" marker-end="url(#a-flow)"/>
    <text x="460" y="174" text-anchor="middle" fill="#93a1b3" font-size="10">Pub/Sub</text>
    <path d="M664 184 L700 184" stroke="#5ee6a8" stroke-width="1.5" marker-end="url(#a-flow)"/>
    <path d="M886 184 L922 184" stroke="#5ee6a8" stroke-width="1.5" marker-end="url(#a-flow)"/>
    <path d="M1108 184 L1150 184" stroke="#5ee6a8" stroke-width="1.5" marker-end="url(#a-flow)"/>
    <text x="1195" y="180" text-anchor="middle" fill="#5ee6a8" font-size="11">calendar</text>
    <text x="1195" y="195" text-anchor="middle" fill="#5ee6a8" font-size="11">document</text>

    <!-- ── Stop points ───────────────────────────────────────────────────── -->
    <text x="40" y="290" fill="#ff6b6b" font-size="12" font-weight="600">Four places it stops — every one recorded in the audit log</text>

    <path d="M352 224 L352 300" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#a-stop)"/>
    <path d="M574 224 L574 300" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#a-stop)"/>
    <path d="M796 224 L796 300" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#a-stop)"/>
    <path d="M1018 224 L1018 300" stroke="#f0b24b" stroke-width="1.5" marker-end="url(#a-stop)"/>

    <rect x="262" y="306" width="180" height="62" rx="8" fill="#1a1416" stroke="#ff6b6b" stroke-width="1.2"/>
    <text x="352" y="328" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="600">blocked</text>
    <text x="352" y="346" text-anchor="middle" fill="#93a1b3" font-size="11">injection hidden in</text>
    <text x="352" y="360" text-anchor="middle" fill="#93a1b3" font-size="11">the text layer</text>

    <rect x="484" y="306" width="180" height="62" rx="8" fill="#1a1416" stroke="#ff6b6b" stroke-width="1.2"/>
    <text x="574" y="328" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="600">halted</text>
    <text x="574" y="346" text-anchor="middle" fill="#93a1b3" font-size="11">budget spent, or the</text>
    <text x="574" y="360" text-anchor="middle" fill="#93a1b3" font-size="11">same call repeating</text>

    <rect x="706" y="306" width="180" height="62" rx="8" fill="#1a1416" stroke="#ff6b6b" stroke-width="1.2"/>
    <text x="796" y="328" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="600">denied</text>
    <text x="796" y="346" text-anchor="middle" fill="#93a1b3" font-size="11">outside this agent's</text>
    <text x="796" y="360" text-anchor="middle" fill="#93a1b3" font-size="11">department boundary</text>

    <rect x="928" y="306" width="180" height="62" rx="8" fill="#1f1a10" stroke="#f0b24b" stroke-width="1.2"/>
    <text x="1018" y="328" text-anchor="middle" fill="#f0b24b" font-size="12" font-weight="600">waits for you</text>
    <text x="1018" y="346" text-anchor="middle" fill="#93a1b3" font-size="11">clinical, or irreversible</text>
    <text x="1018" y="360" text-anchor="middle" fill="#93a1b3" font-size="11">outside the system</text>

    <!-- ── State ─────────────────────────────────────────────────────────── -->
    <rect x="40" y="400" width="1150" height="46" rx="8" fill="#111820" stroke="#2e3a49" stroke-width="1.2"/>
    <text x="58" y="428" fill="#93a1b3" font-size="11">
      Firestore — one idempotency key per side effect, claimed before it happens and released only if it did not.
      A crash mid-step resumes; it does not repeat.
    </text>

    <text x="40" y="132" fill="#5ee6a8" font-size="11" font-weight="600">Gemini 3.5 · Google ADK · Cloud Run · Pub/Sub · Firestore · Cloud Storage</text>
  </g>
</svg>
