[project]
name = "vigil"
version = "0.1.0"
description = "An agent fleet that keeps watch, so caregivers don't have to."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Agent framework + model access (both mandatory for the hackathon)
    "google-adk",
    "google-genai",
    # Google Cloud infrastructure
    "google-cloud-firestore",
    "google-cloud-pubsub",
    "google-cloud-storage",
    "google-cloud-secret-manager",
    # API surface
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    # Observability — reasoning-chain traces are a graded requirement
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "structlog",
    "httpx",
    "python-dotenv>=1.2.2",
    "pypdf>=6.15.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "reportlab>=5.0.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
